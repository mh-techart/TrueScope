name: Bug report
description: Something in TrueScope behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        One thing worth trying first: if the scopes render wrongly, open the
        settings (the gear icon at the top right of the TrueScope tab) and switch
        from **GPU** to **CPU**, then see whether it still happens. That single
        answer narrows most rendering problems down a long way.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? A screenshot of the TrueScope panel usually says more than a description.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Window → TrueScope
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: engine
    attributes:
      label: Unreal Engine version
      placeholder: "5.8.2"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Model, and the driver version if you know it.
      placeholder: "NVIDIA RTX 4070, driver 566.36"
    validations:
      required: true

  - type: dropdown
    id: path
    attributes:
      label: Does it also happen with the other setting (GPU / CPU)?
      description: Switch it with the gear icon at the top right of the TrueScope tab.
      options:
        - Happens with both GPU and CPU
        - Only with GPU
        - Only with CPU
        - Not applicable / did not try
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TrueScope version
      description: Shown in Edit → Plugins.
      placeholder: "0.9.0"
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log output
      description: |
        Any lines from the Output Log in TrueScope's two log categories,
        `LogTrueScope` and `LogTrueScopeAnalysis`, plus any warning or error
        from around the time it happened. For considerably more detail, enter
        both of these in the editor console before reproducing — each command
        raises only the category it names:

        ```
        Log LogTrueScope Verbose
        Log LogTrueScopeAnalysis Verbose
        ```
      render: text
    validations:
      required: false
